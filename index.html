<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>داشبورد عمده‌فروشان مواد غذایی ایران</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--line:#e5e7eb;--ink:#111827;--mute:#6b7280;--acc:#e2654a;--acc2:#fdece8;--hd:#f9fafb;--row:#f3f4f6}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--line:#2a2e37;--ink:#e8eaed;--mute:#9aa0aa;--acc2:#3a2520;--hd:#1d2027;--row:#20242b}}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:13px;line-height:1.6}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px clamp(12px,3vw,28px);display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
h1{font-size:16px;font-weight:700}.sub{color:var(--mute);font-size:12px}
.sp{flex:1}
main{padding:clamp(10px,2vw,24px);display:grid;gap:14px;max-width:1700px;margin:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.st b{display:block;font-size:22px;font-weight:700}.st span{color:var(--mute);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.tools{padding:12px;display:grid;grid-template-columns:2fr repeat(4,1fr);gap:8px}
input,select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
select{width:100%}input[type=search]{width:100%}
button{cursor:pointer}button:hover{border-color:var(--acc)}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 12px 12px}
.chk{display:flex;gap:6px;align-items:center;cursor:pointer;color:var(--mute)}.chk input{accent-color:var(--acc)}
.wrap{overflow:auto;max-height:68vh;border-top:1px solid var(--line)}
table{border-collapse:separate;border-spacing:0;width:100%}
th{position:sticky;top:0;background:var(--hd);text-align:right;font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--acc)}th .ar{color:var(--acc)}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;max-width:340px}
tr:nth-child(even) td{background:var(--row)}tbody tr{cursor:pointer}tbody tr:hover td{background:var(--acc2)}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}td.ph{direction:ltr;text-align:right;white-space:nowrap}
.pg{display:flex;gap:8px;align-items:center;padding:10px 12px;flex-wrap:wrap;border-top:1px solid var(--line)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.ch{padding:12px}.ch h3{font-size:13px;margin-bottom:8px}
.br{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;margin:3px 0;cursor:pointer;font-size:12px}
.bt{height:8px;background:var(--row);border-radius:99px;overflow:hidden}.bt i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bt+span{color:var(--mute)}
aside{position:fixed;inset:0 auto 0 0;width:min(380px,100%);background:var(--card);border-inline-end:1px solid var(--line);box-shadow:4px 0 24px #0003;padding:18px;overflow:auto;transform:translateX(-105%);transition:transform .2s;z-index:10}
aside.on{transform:none}
aside h2{font-size:16px;margin-bottom:10px}aside dl{display:grid;grid-template-columns:90px 1fr;gap:6px 10px}aside dt{color:var(--mute)}aside dd{word-break:break-word}
aside .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
a{color:var(--acc)}
@media(max-width:820px){.tools{grid-template-columns:1fr 1fr}.tools input{grid-column:1/-1}}
</style></head><body>
<header><h1>داشبورد عمده‌فروشان مواد غذایی ایران</h1><span class="sub" id="upd"></span><span class="sp"></span>
<button id="cols">ستون‌ها</button><button id="csv">خروجی CSV</button><button class="p" id="xls">خروجی اکسل</button></header>
<main>
<div class="stats" id="stats"></div>
<div class="charts" id="charts"></div>
<section class="card">
 <div class="tools">
  <input type="search" id="q" placeholder="جستجو در نام، نشانی، تلفن، شهر…" aria-label="جستجو">
  <select id="fGrp" aria-label="گروه"></select><select id="fOst" aria-label="استان"></select>
  <select id="fCity" aria-label="شهر"></select><select id="fRate" aria-label="حداقل امتیاز"></select>
 </div>
 <div class="bar"><label class="chk"><input type="checkbox" id="fPhone"> فقط دارای تلفن</label>
  <label class="chk"><input type="checkbox" id="fMob"> فقط موبایل</label>
  <button id="reset">پاک‌کردن فیلترها</button><span class="sub" id="cnt"></span></div>
 <div class="wrap"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
 <div class="pg"><button id="prev">قبلی</button><span id="pi" class="sub"></span><button id="next">بعدی</button>
  <select id="ps" aria-label="تعداد ردیف در صفحه" style="width:auto"><option>50</option><option>100</option><option>200</option></select></div>
</section>
<p class="sub">داده از نقشه‌های بلد و نشان (و در صورت اجرا، گوگل‌مپ) گردآوری شده و با هر اجرای جمع‌آوری به‌روز می‌شود.</p>
</main>
<aside id="dr" aria-live="polite"></aside>
<div id="menu" class="card" hidden style="position:fixed;top:56px;left:16px;padding:10px;z-index:11;display:grid;gap:6px"></div>
<script>
const $=id=>document.getElementById(id);
const RAW='https://raw.githubusercontent.com/alirezahasheminezhad/iran-food-directory/sitedata/places.json';
const COLS=[['name','نام'],['grp','گروه'],['cat','دسته'],['ostan','استان'],['city','شهر'],['address','نشانی'],['phone','تلفن'],['hours','ساعت کار'],['rating','امتیاز'],['nratings','تعداد نظر'],['website','وب‌سایت'],['instagram','اینستاگرام'],['src','منبع']];
const fa=n=>n==null||n===''?'':Number(n).toLocaleString('fa-IR');
const digits=t=>String(t??'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const norm=t=>digits(t).replace(/ي/g,'ی').replace(/ك/g,'ک').toLowerCase();
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const phones=p=>String(p??'').split(/[،,;؛]/).map(s=>digits(s).replace(/\D/g,'')).filter(Boolean);
let D=[],view=[],sort={k:'name',d:1},page=0,hidden=new Set(['nratings','hours','website']);
const lsGet=()=>{try{return JSON.parse(localStorage.getItem('ifd_hidden'))}catch{return null}};
hidden=new Set(lsGet()||['nratings','hours','website']);

async function load(){
  let d;
  for(const u of [RAW+'?_='+Math.floor(Date.now()/6e5),'places.json']){
    try{const r=await fetch(u);if(r.ok){d=await r.json();break}}catch{}
  }
  if(!d){$('cnt').innerHTML='داده بارگذاری نشد <button id="retry">تلاش دوباره</button>';$('retry').onclick=load;return}
  D=d.rows.map(r=>{const o={};d.cols.forEach((c,i)=>o[c]=r[i]);o._s=norm([o.name,o.address,o.phone,o.city,o.ostan,o.cat].join(' '))+' '+phones(o.phone).join(' ');return o});
  $('upd').textContent='آخرین به‌روزرسانی: '+new Date(d.updated*1000).toLocaleDateString('fa-IR');
  fill();apply();
}
function opts(sel,label,vals){sel.innerHTML=`<option value="">${label}</option>`+vals.map(v=>`<option>${esc(v)}</option>`).join('')}
const uniq=k=>[...new Set(D.map(o=>o[k]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fa'));
function fill(){
  opts($('fGrp'),'همه‌ی گروه‌ها',uniq('grp'));opts($('fOst'),'همه‌ی استان‌ها',uniq('ostan'));opts($('fCity'),'همه‌ی شهرها',uniq('city'));
  $('fRate').innerHTML='<option value="">هر امتیاز</option>'+[4.5,4,3.5,3].map(v=>`<option value="${v}">امتیاز ${fa(v)}+</option>`).join('');
}
const mob=p=>phones(p).some(n=>/^(09\d{9}|989\d{9}|00989\d{9})$/.test(n));
function apply(){
  const q=norm($('q').value).split(/\s+/).filter(Boolean),g=$('fGrp').value,o=$('fOst').value,c=$('fCity').value,r=+$('fRate').value||0,ph=$('fPhone').checked,mb=$('fMob').checked;
  view=D.filter(x=>(!g||x.grp===g)&&(!o||x.ostan===o)&&(!c||x.city===c)&&(!r||(x.rating||0)>=r)&&(!ph||x.phone)&&(!mb||mob(x.phone))&&q.every(t=>x._s.includes(t)));
  const {k,d}=sort,num=k==='rating'||k==='nratings';
  view.sort((a,b)=>{const A=a[k],B=b[k],ea=A==null||A==='',eb=B==null||B==='';if(ea&&eb)return 0;if(ea)return 1;if(eb)return -1;return d*(num?A-B:String(A).localeCompare(String(B),'fa'))});
  page=0;render();stats();
}
function stats(){
  const n=view.length,w=view.filter(x=>x.phone).length,rt=view.filter(x=>x.rating);
  const S=[['تعداد نتیجه',fa(n)],['دارای تلفن',fa(w)+(n?` (${fa(Math.round(w/n*100))}٪)`:'')],['شهر',fa(new Set(view.map(x=>x.city)).size)],['استان',fa(new Set(view.map(x=>x.ostan).filter(Boolean)).size)],['میانگین امتیاز',rt.length?fa((rt.reduce((s,x)=>s+x.rating,0)/rt.length).toFixed(2)):'—']];
  $('stats').innerHTML=S.map(([l,v])=>`<div class="st"><b>${v}</b><span>${l}</span></div>`).join('');
  $('charts').innerHTML=bars('گروه‌ها','grp','fGrp')+bars('پرتعدادترین استان‌ها','ostan','fOst',8)+bars('پرتعدادترین شهرها','city','fCity',8);
  document.querySelectorAll('.br').forEach(e=>e.onclick=()=>{$(e.dataset.f).value=e.dataset.v;apply()});
}
function bars(t,k,f,lim=6){
  const m={};view.forEach(x=>{if(x[k])m[x[k]]=(m[x[k]]||0)+1});
  const a=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,lim),mx=a[0]?a[0][1]:1;
  return `<div class="card ch"><h3>${t}</h3>${a.map(([v,c])=>`<div class="br" data-f="${f}" data-v="${esc(v)}" title="فیلتر"><span>${esc(v)}</span><div class="bt"><i style="width:${c/mx*100}%"></i></div><span>${fa(c)}</span></div>`).join('')}</div>`;
}
function render(){
  const cs=COLS.filter(([k])=>!hidden.has(k)),ps=+$('ps').value,pages=Math.max(1,Math.ceil(view.length/ps));
  $('th').innerHTML='<tr><th>#</th>'+cs.map(([k,l])=>`<th data-k="${k}" tabindex="0" aria-sort="${sort.k===k?(sort.d>0?'ascending':'descending'):'none'}">${l}<span class="ar"> ${sort.k===k?(sort.d>0?'▲':'▼'):''}</span></th>`).join('')+'</tr>';
  const rows=view.slice(page*ps,page*ps+ps);
  $('tb').innerHTML=rows.map((x,i)=>`<tr data-i="${page*ps+i}"><td class="n">${fa(page*ps+i+1)}</td>`+cs.map(([k])=>`<td class="${k==='phone'?'ph':k==='rating'||k==='nratings'?'n':''}">${esc(k==='rating'||k==='nratings'?fa(x[k]):x[k])}</td>`).join('')+'</tr>').join('')||`<tr><td colspan="99" class="sub" style="padding:24px;text-align:center">نتیجه‌ای پیدا نشد</td></tr>`;
  $('cnt').textContent=fa(view.length)+' از '+fa(D.length);
  $('pi').textContent=`صفحه ${fa(page+1)} از ${fa(pages)}`;$('prev').disabled=!page;$('next').disabled=page+1>=pages;
  document.querySelectorAll('th[data-k]').forEach(h=>{const go=()=>{sort={k:h.dataset.k,d:sort.k===h.dataset.k?-sort.d:1};apply()};h.onclick=go;h.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
  document.querySelectorAll('tbody tr[data-i]').forEach(r=>r.onclick=()=>detail(view[+r.dataset.i]));
}
function detail(x){
  const has=x.lat!=null&&x.lng!=null&&x.lat!==''&&x.lng!=='';
  const map=`https://www.google.com/maps?q=${x.lat},${x.lng}`,nesh=`https://neshan.org/maps/@${x.lat},${x.lng},17z`;
  const site=x.website?(/^https?:\/\//i.test(x.website)?x.website:'https://'+x.website):'';
  const ig=x.instagram?String(x.instagram).split('،')[0].trim():'';
  const tel=phones(x.phone)[0]||x.phone;
  $('dr').innerHTML=`<h2>${esc(x.name)}</h2><dl>${COLS.slice(1).map(([k,l])=>x[k]!=null&&x[k]!==''?`<dt>${l}</dt><dd>${esc(x[k])}</dd>`:'').join('')}</dl>
  <div class="acts">${x.phone?`<a href="tel:${esc(tel)}"><button>تماس</button></a><button id="cp">کپی تلفن</button>`:''}${site?`<a href="${esc(site)}" target="_blank" rel="noopener"><button>وب‌سایت</button></a>`:''}${ig?`<a href="${esc(ig)}" target="_blank" rel="noopener"><button>اینستاگرام</button></a>`:''}${has?`<a href="${map}" target="_blank" rel="noopener"><button>گوگل‌مپ</button></a><a href="${nesh}" target="_blank" rel="noopener"><button>نشان</button></a>`:''}<button id="cl">بستن</button></div>`;
  $('cl').onclick=()=>$('dr').classList.remove('on');if($('cp'))$('cp').onclick=()=>navigator.clipboard.writeText(x.phone);
  $('dr').classList.add('on');
}
const exp=()=>view.map(x=>Object.fromEntries(COLS.filter(([k])=>!hidden.has(k)).map(([k,l])=>[l,x[k]??''])));
$('csv').onclick=()=>{const r=exp();if(!r.length)return;const h=Object.keys(r[0]),q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const b=new Blob(['﻿'+[h.map(q).join(',')].concat(r.map(o=>h.map(k=>q(o[k])).join(','))).join('\r\n')],{type:'text/csv;charset=utf-8'});
  Object.assign(document.createElement('a'),{href:URL.createObjectURL(b),download:'iran-food.csv'}).click()};
$('xls').onclick=async()=>{
  if(!view.length)return;
  try{
    if(!window.XLSX)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
    const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(exp()),'فهرست');XLSX.writeFile(wb,'iran-food.xlsx');
  }catch{alert('کتابخانه اکسل بارگذاری نشد؛ اتصال اینترنت را بررسی کنید یا از خروجی CSV استفاده کنید.')}};
$('cols').onclick=e=>{const m=$('menu');m.hidden=!m.hidden;m.innerHTML=COLS.map(([k,l])=>`<label class="chk"><input type="checkbox" data-k="${k}" ${hidden.has(k)?'':'checked'}> ${l}</label>`).join('');
  m.querySelectorAll('input').forEach(i=>i.onchange=()=>{i.checked?hidden.delete(i.dataset.k):hidden.add(i.dataset.k);try{localStorage.setItem('ifd_hidden',JSON.stringify([...hidden]))}catch{}render()})};
let tm;$('q').oninput=()=>{clearTimeout(tm);tm=setTimeout(apply,200)};
['fGrp','fOst','fCity','fRate','fPhone','fMob'].forEach(i=>$(i).onchange=apply);
$('ps').onchange=()=>{page=0;render()};
$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};
$('reset').onclick=()=>{$('q').value='';['fGrp','fOst','fCity','fRate'].forEach(i=>$(i).value='');$('fPhone').checked=$('fMob').checked=false;apply()};
document.onkeydown=e=>{if(e.key==='Escape'){$('dr').classList.remove('on');$('menu').hidden=true}};
load();
</script></body></html>
