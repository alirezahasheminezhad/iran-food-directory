name: pages

# Deploys the dashboard (index.html) with the freshest places.json from the sitedata branch.
# Enable once: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# (configure-pages below also tries to enable it automatically).

on:
  push:
    branches: [main]
    paths: [index.html, .github/workflows/pages.yml]
  workflow_dispatch:
  workflow_run:
    workflows: [scrape]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site (dashboard + latest data)
        run: |
          mkdir _site
          cp index.html _site/
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/sitedata/places.json" -o _site/places.json \
            || cp places.json _site/places.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4