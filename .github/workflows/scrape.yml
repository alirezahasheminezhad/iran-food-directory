name: scrape

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Also fetch opening hours (slow, off by default)"
        type: boolean
        default: false
      round:
        description: "Chain counter (set automatically)"
        default: "0"
  schedule:
    - cron: "23 3 * * *"   # daily safety net; exits in a minute when everything is done

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write   # release with the data
  actions: write    # lets a run start the next one

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # GitHub hard limit is 360
    env:
      GH_TOKEN: ${{ github.token }}
      WANT_HOURS: ${{ inputs.hours || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore data (release "data")
        run: gh release download data -p iran_food.db || echo "no saved data yet - starting fresh"

      - name: Merge the earlier run from another IP (adds its places, marks its finished jobs done)
        run: python iran_food_scraper.py --merge seed/iran_food_local.db

      - name: Connectivity test (Balad + Neshan from this runner)
        run: python iran_food_scraper.py --smoke

      - name: Scrape
        id: scrape
        run: |
          if [ "$WANT_HOURS" = "true" ]; then H="--hours"; else H=""; fi
          # the daily run also gives failed jobs a new chance, so nothing stays "given up" forever
          if [ "${{ github.event_name }}" = "schedule" ]; then H="$H --retry"; fi
          python iran_food_scraper.py --max-minutes 300 $H

      - name: Coverage report (per province; also shown on the run summary page)
        if: always()
        run: |
          [ -f iran_food.db ] || exit 0
          python iran_food_scraper.py --coverage | tee coverage.txt
          { echo '### پوشش استان‌ها'; echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Save data
        if: always()
        run: |
          [ -f iran_food.db ] || exit 0
          gh release view data >/dev/null 2>&1 || gh release create data --title "data" --notes "Scraper state and the Excel file (updated automatically)"
          FILES="iran_food.db"
          [ -f iran_food_directory.xlsx ] && FILES="$FILES iran_food_directory.xlsx"
          [ -f errors.log ] && FILES="$FILES errors.log"
          [ -f coverage.txt ] && FILES="$FILES coverage.txt"
          gh release upload data $FILES --clobber

      - name: Publish dashboard data (orphan branch sitedata, single commit)
        if: always()
        run: |
          [ -f iran_food.db ] || exit 0
          d=$(mktemp -d) && python export_json.py iran_food.db "$d/places.json" && cd "$d"
          git init -q -b sitedata && git config user.name scrape-bot && git config user.email bot@users.noreply.github.com
          git add . && git commit -qm "data $(date -u +%FT%TZ)"
          git push -q -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git sitedata

      - name: Start the next run if work is left
        # keep going even if the scrape hit a transient error; only a skipped (failed smoke test)
        # or cancelled run stops the chain - the daily cron restarts it then
        if: always() && steps.scrape.outcome != 'skipped' && steps.scrape.outcome != 'cancelled'
        run: |
          [ -f iran_food.db ] || exit 0
          if [ "$WANT_HOURS" = "true" ]; then H="--hours"; else H=""; fi
          LEFT=$(python iran_food_scraper.py --status $H)
          ROUND=${{ inputs.round || 0 }}
          echo "work left: $LEFT (round $ROUND)"
          if [ "$LEFT" -gt 0 ] && [ "$ROUND" -lt 200 ]; then
            gh workflow run scrape.yml -f hours=$WANT_HOURS -f round=$((ROUND + 1))
          fi
